name: Build LLMFarm IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository con sottomoduli
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Pods
        run: pod install

      - name: Build Xcode Project
        run: |
          xcodebuild -workspace LLMFarm.xcworkspace \
                     -scheme LLMFarm \
                     -sdk iphoneos \
                     -configuration Release \
                     build CODE_SIGNING_ALLOWED=NO

      - name: Impacchetta file IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/LLMFarm.app Payload/
          zip -r LLMFarm.ipa Payload/

      - name: Carica il file IPA come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLMFarm-Unsigned-IPA
          path: LLMFarm.ipa
