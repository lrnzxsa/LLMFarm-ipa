name: Build LLMFarm IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository con sottomoduli
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Configura ambiente Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Compila i binari C++ (llama.xcframework)
        run: |
          # Assegna i permessi agli script di build
          chmod +x llmfarm_core.swift/*.sh 2>/dev/null || true
          chmod +x llmfarm_core.swift/llama.cpp/*.sh 2>/dev/null || true
          
          # Esegui lo script di build delle librerie se presente
          cd llmfarm_core.swift
          if [ -f "build_xcframework.sh" ]; then
            ./build_xcframework.sh
          elif [ -f "llama.cpp/build-apple.sh" ]; then
            cd llama.cpp && ./build-apple.sh
          fi

      - name: Build Xcode Project
        run: |
          xcodebuild -project LLMFarm.xcodeproj \
                     -scheme LLMFarm \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     build CODE_SIGNING_ALLOWED=NO

      - name: Impacchetta file IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LLMFarm.app Payload/
          zip -r LLMFarm.ipa Payload/

      - name: Carica il file IPA come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLMFarm-Unsigned-IPA
          path: LLMFarm.ipa
