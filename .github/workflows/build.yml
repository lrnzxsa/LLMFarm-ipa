name: Build LLMFarm IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository con sottomoduli
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Installa dipendenze (CMake)
        run: brew install cmake
      - name: Compila i binari C++ (llama.xcframework)
        run: |
          # Lo script si trova nella root del progetto LLMFarm
          echo "Assegno i permessi ed eseguo build-xcframework_cpu.sh"
          chmod +x build-xcframework_cpu.sh
          ./build-xcframework_cpu.sh
          
          if [ ! -d "llmfarm_core.swift/llama.cpp/build-apple/llama.xcframework" ]; then
            echo "Avviso: llama.xcframework non trovato nel percorso standard, verifico le alternative..."
            find . -name "llama.xcframework"
          fi
      
      - name: Compila i binari C++ (llama.xcframework)
        run: |
          cd llmfarm_core.swift
          
          # Trova ed esegue lo script di build corretto per i framework Apple
          BUILD_SCRIPT=$(find . -maxdepth 1 -name "*apple*.sh" -o -name "build*.sh" | head -n 1)
          echo "Eseguo lo script: $BUILD_SCRIPT"
          chmod +x "$BUILD_SCRIPT"
          ./"$BUILD_SCRIPT"
          
          # Verifica che il framework sia stato generato correttamente
          if [ ! -d "llama.cpp/build-apple/llama.xcframework" ]; then
            echo "ERRORE: llama.xcframework non è stato generato dallo script."
            exit 1
          fi

      - name: Build Xcode Project
        run: |
          xcodebuild -project LLMFarm.xcodeproj \
                     -scheme LLMFarm \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     build CODE_SIGNING_ALLOWED=NO

      - name: Impacchetta file IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LLMFarm.app Payload/
          zip -r LLMFarm.ipa Payload/

      - name: Carica il file IPA come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLMFarm-Unsigned-IPA
          path: LLMFarm.ipa
