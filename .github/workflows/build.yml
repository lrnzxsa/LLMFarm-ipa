name: Build LLMFarm IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository con sottomoduli
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Compila llama.xcframework
        run: |
          cd llmfarm_core.swift
          if [ -f "build_xcframework.sh" ]; then
            chmod +x build_xcframework.sh
            ./build_xcframework.sh
          elif [ -f "build_metal.sh" ]; then
            chmod +x build_metal.sh
            ./build_metal.sh
          elif [ -f "build_llama.sh" ]; then
            chmod +x build_llama.sh
            ./build_llama.sh
          else
            find . -maxdepth 2 -name "*.sh" -exec chmod +x {} \; -exec {} \;
          fi

      - name: Build Xcode Project
        run: |
          xcodebuild -project LLMFarm.xcodeproj \
                     -scheme LLMFarm \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     build CODE_SIGNING_ALLOWED=NO

      - name: Impacchetta file IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LLMFarm.app Payload/
          zip -r LLMFarm.ipa Payload/

      - name: Carica il file IPA come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLMFarm-Unsigned-IPA
          path: LLMFarm.ipa
