name: Build LLMFarm IPA

on:
  workflow_dispatch: # Permette di avviare il workflow manualmente dalla tab "Actions"
  push:
    branches: [ "main" ]

jobs:
  build-ipa:
    name: Build iOS App
    runs-on: macos-15-intel

    steps:
      - name: Checkout del repository con sottomoduli
        uses: actions/checkout@v4
        with:
          repository: 'guinmoon/LLMFarm'
          submodules: recursive # Equivalente a --recurse-submodules
          fetch-depth: 0

      - name: Seleziona la versione di Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build dell'archivio Xcode (Unsigned)
        run: |
          xcodebuild clean archive \
            -project LLMFarm.xcodeproj \
            -scheme LLMFarm \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ${{ github.workspace }}/build/LLMFarm.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Pacchettizzazione nel file .ipa
        run: |
          cd ${{ github.workspace }}/build
          mkdir -p Payload
          # Copia l'applicazione compilata nella cartella Payload
          cp -r LLMFarm.xcarchive/Products/Applications/LLMFarm.app Payload/
          # Comprime la cartella Payload nel formato .ipa
          zip -qr LLMFarm.ipa Payload/

      - name: Carica l'artifact .ipa
        uses: actions/upload-artifact@v4
        with:
          name: LLMFarm-Release-IPA
          path: ${{ github.workspace }}/build/LLMFarm.ipa
          retention-days: 7
